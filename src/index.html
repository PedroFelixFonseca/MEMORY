<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MEMORY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
  </head>
  <body>
    <h1>Memory Game</h1>
    <div id="menu">

      <div id="mode-choice">
        <button id="mode-free">Free play</button>
        <button id="mode-challenge">Challenge</button>
      </div>

      <div id="challenge-settings" hidden>
        <h2>Difficulté</h2>
        <div id="difficulty-options"></div>
        <h2>Temps</h2>
        <div id="time-options"></div>
        <button id="start-challenge">Lancer</button>
        <button id="back">Retour</button>
      </div>
    </div>

    <div id="game" hidden>
      <div class="tombe" id="tombe">
        <div class="stats">
          <span>Turns : <strong id="moves">0</strong></span>
          <span>Time   : <strong id="timer">00:00</strong></span>
          <button class="btn" id="restart">Rejouer</button>
          <button class="btn" id="menu-btn">Menu</button>
        </div>
        <div id="board">
        </div>
      </div>
    </div>
 
    <script src="js/main.js" type="module"></script>
  </body>
</html>
